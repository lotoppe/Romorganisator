<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fjordslottet – Gjesteorganisering</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:       #0d1b2a;
      --navy-light: #162333;
      --navy-mid:   #1e2f42;
      --gold:       #c9a840;
      --gold-light: #e8d5a3;
      --gold-dark:  #a0832e;
      --cream:      #f8f4ec;
      --cream-dark: #ede6d8;
      --text-dark:  #1a1208;
      --green:      #2d6a4f;
      --green-lite: #52b788;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Raleway', sans-serif; background: var(--navy); color: var(--cream); min-height: 100vh; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--navy); }
    ::-webkit-scrollbar-thumb { background: rgba(201,168,64,.35); border-radius: 3px; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer;
      font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 12px;
      letter-spacing: 1.5px; text-transform: uppercase; transition: all .2s; white-space: nowrap;
    }
    .btn-gold { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: var(--navy); }
    .btn-gold:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(201,168,64,.3); }
    .btn-outline { background: transparent; color: var(--gold-light); border: 1px solid rgba(201,168,64,.5); }
    .btn-outline:hover { background: rgba(201,168,64,.1); border-color: var(--gold); }
    .btn-sm { padding: 5px 12px; font-size: 11px; }
    .btn-danger { background: transparent; color: #ef9a9a; border: 1px solid rgba(239,154,154,.4); }
    .btn-danger:hover { background: rgba(239,154,154,.1); }

    /* ── INPUTS ── */
    label.field-label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--gold-light); opacity: .75; margin-bottom: 7px;
    }
    input[type=text], input[type=number], textarea, select {
      width: 100%; background: var(--navy-light); border: 1px solid rgba(201,168,64,.25);
      border-radius: 4px; color: var(--cream); padding: 10px 14px;
      font-family: 'Raleway', sans-serif; font-size: 14px; outline: none; transition: border-color .2s;
    }
    input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus { border-color: var(--gold); }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    textarea { resize: vertical; min-height: 90px; }

    /* ═══════════════════════════════════════
       START SCREEN
    ═══════════════════════════════════════ */
    #startScreen {
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 24px 40px; min-height: 100vh;
    }
    .start-header { text-align: center; margin-bottom: 44px; }
    .ornament { display: block; font-size: 18px; color: var(--gold); letter-spacing: 18px; margin-bottom: 14px; }
    .start-header h1 {
      font-family: 'Playfair Display', serif; font-size: clamp(32px, 5vw, 52px);
      font-weight: 700; color: var(--gold-light); letter-spacing: 2px;
      text-shadow: 0 2px 12px rgba(0,0,0,.4);
    }
    .gold-rule {
      width: 220px; height: 1px; margin: 18px auto;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }
    .start-header p {
      font-weight: 300; font-size: 14px; letter-spacing: 6px;
      text-transform: uppercase; opacity: .7;
    }

    .start-single { width: 100%; max-width: 620px; margin-bottom: 32px; }

    .card {
      background: var(--navy-mid); border: 1px solid rgba(201,168,64,.22);
      border-radius: 8px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }
    .card h2 {
      font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold-light);
      margin-bottom: 22px; padding-bottom: 12px; border-bottom: 1px solid rgba(201,168,64,.18);
    }
    .gap { margin-top: 16px; }
    .gap-lg { margin-top: 24px; }
    .divider {
      display: flex; align-items: center; gap: 12px;
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold-light); opacity: .45; margin: 18px 0;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(201,168,64,.18); }

    .row-2 { display: flex; gap: 10px; align-items: flex-end; }
    .row-2 > *:first-child { flex: 1; }

    .tag-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; max-height: 220px; overflow-y: auto; }
    .guest-tag {
      background: var(--navy-light); border: 1px solid rgba(201,168,64,.22);
      border-radius: 20px; padding: 4px 10px 4px 14px; font-size: 12px; color: var(--cream);
      display: flex; align-items: center; gap: 8px;
    }
    .guest-tag button {
      background: none; border: none; color: rgba(201,168,64,.4); cursor: pointer;
      font-size: 15px; line-height: 1; padding: 0; transition: color .15s;
    }
    .guest-tag button:hover { color: #ef9a9a; }

    .meta-text { font-size: 12px; color: var(--gold-light); opacity: .55; margin-top: 10px; }

    .start-footer { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .btn-hero {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: var(--navy); padding: 16px 52px; font-size: 15px; border: none;
      border-radius: 4px; cursor: pointer; font-family: 'Playfair Display', serif;
      font-weight: 600; letter-spacing: 2px; transition: all .25s;
      box-shadow: 0 4px 20px rgba(201,168,64,.2);
    }
    .btn-hero:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,168,64,.4); }

    /* ═══════════════════════════════════════
       ORG SCREEN
    ═══════════════════════════════════════ */
    #orgScreen { display: none; flex-direction: column; height: 100vh; overflow: hidden; }

    .org-header {
      background: var(--navy-mid); border-bottom: 1px solid rgba(201,168,64,.25);
      padding: 11px 22px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0; gap: 12px; flex-wrap: wrap;
    }
    .org-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--gold-light); letter-spacing: 1px; }
    .org-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Hamburger menu */
    .menu-wrap { position: relative; }
    .menu-btn { font-size: 15px; padding: 6px 12px; }
    .menu-dropdown {
      display: none; position: absolute; top: calc(100% + 8px); left: 0;
      background: var(--navy-mid); border: 1px solid rgba(201,168,64,.3);
      border-radius: 6px; min-width: 180px; overflow: hidden; z-index: 150;
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
    }
    .menu-dropdown.open { display: block; }
    .menu-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 16px;
      cursor: pointer; font-size: 13px; color: var(--cream); transition: background .15s;
    }
    .menu-item:hover { background: rgba(201,168,64,.1); }
    .menu-item.active { color: var(--gold-light); background: rgba(201,168,64,.08); }
    .menu-item .mi-icon { font-size: 15px; }

    .org-body { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 270px; flex-shrink: 0; background: var(--navy-mid);
      border-right: 1px solid rgba(201,168,64,.18);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header { padding: 16px 18px 10px; border-bottom: 1px solid rgba(201,168,64,.15); flex-shrink: 0; }
    .sidebar-header h3 { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--gold-light); }
    .sidebar-meta { font-size: 11px; color: var(--gold-light); opacity: .5; margin-top: 4px; letter-spacing: .5px; }
    .sidebar-list {
      flex: 1; overflow-y: auto; padding: 10px 12px;
      transition: background .15s;
    }
    .sidebar-list.drop-target { background: rgba(201,168,64,.07); }

    .guest-card {
      background: var(--cream-dark); border: 1px solid rgba(201,168,64,.3);
      border-radius: 4px; padding: 9px 12px; margin-bottom: 6px;
      cursor: grab; color: var(--text-dark); font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      user-select: none; transition: all .15s;
    }
    .guest-card:hover { background: var(--cream); border-color: var(--gold); box-shadow: 0 2px 8px rgba(201,168,64,.2); }
    .guest-card:active { cursor: grabbing; }
    .guest-card.dragging { opacity: .4; }
    .guest-card.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,168,64,.35); }
    .drag-dots { font-size: 11px; color: rgba(0,0,0,.25); flex-shrink: 0; }
    .sidebar-empty { font-size: 12px; color: rgba(255,255,255,.3); text-align: center; margin-top: 28px; line-height: 1.7; }

    /* Resource area (rooms or vehicles) */
    .rooms-area { flex: 1; overflow-y: auto; padding: 24px; background: var(--navy); }
    .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }

    /* Room card */
    .room-card {
      background: var(--cream); border: 2px solid rgba(201,168,64,.35);
      border-radius: 8px; overflow: hidden; transition: border-color .3s, box-shadow .3s;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .room-card.full { border-color: var(--green-lite); box-shadow: 0 4px 20px rgba(82,183,136,.25); }

    .room-card-head {
      background: var(--navy-mid); padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(201,168,64,.18); transition: background .3s;
      position: relative;
    }
    .room-card.full .room-card-head { background: var(--green); }

    .room-label { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--gold-light); }
    .room-card.full .room-label { color: #a7f3d0; }
    .room-tally { font-size: 11px; color: rgba(255,255,255,.45); letter-spacing: .5px; }
    .room-card.full .room-tally { color: #6ee7b7; }

    .room-delete {
      background: none; border: none; color: #ef9a9a; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0 0 0 10px;
      opacity: 0; transition: opacity .15s; flex-shrink: 0;
    }
    .room-card:hover .room-delete { opacity: 1; }
    .room-delete:hover { color: #e53935; }

    .guest-delete {
      background: none; border: none; color: rgba(0,0,0,.25); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 0; margin-left: auto;
      opacity: 0; transition: opacity .15s; flex-shrink: 0;
    }
    .guest-card:hover .guest-delete { opacity: 1; }
    .guest-delete:hover { color: #e53935; }

    .room-beds { padding: 16px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; background: var(--cream); }

    /* Bed */
    .bed-slot { display: flex; flex-direction: column; align-items: center; gap: 5px; }

    .bed-wrap {
      width: 68px; height: 92px; border-radius: 6px 6px 4px 4px;
      border: 2px solid #8b6540; background: #f0e8d6;
      display: flex; flex-direction: column; overflow: hidden;
      cursor: default; transition: border-color .15s, background .15s;
      position: relative;
    }
    .bed-wrap.droppable { cursor: copy; }
    .bed-wrap.drop-over { border-color: var(--gold); background: #fffbe8; border-style: dashed; }
    .bed-wrap.occupied { border-color: #4a7c59; background: #e6f4ed; cursor: grab; }
    .bed-wrap.occupied:active { cursor: grabbing; }

    .bed-head {
      height: 22px; flex-shrink: 0;
      background: linear-gradient(to bottom, #3d2010, #6b4228);
      border-bottom: 2px solid #2a1508;
      display: flex; align-items: center; justify-content: center; padding: 0 5px;
    }
    .bed-wrap.occupied .bed-head { background: linear-gradient(to bottom, #1a4731, #2d6a4f); border-bottom-color: #0f2e1e; }

    .bed-pillow {
      margin: 3px 5px 2px;
      background: linear-gradient(to bottom right, #faf7f2, #ede6d8);
      border: 1px solid #d4c4a8; border-radius: 2px; height: 11px; flex-shrink: 0;
    }
    .bed-wrap.occupied .bed-pillow { background: linear-gradient(to bottom right, #c8e8d4, #a8d4b8); border-color: #7fbf9a; }

    .bed-mattress {
      flex: 1; margin: 2px 4px 4px;
      background: linear-gradient(to bottom, #e2d6c0, #d0c4a8);
      border-radius: 2px; display: flex; align-items: center; justify-content: center;
    }
    .bed-wrap.occupied .bed-mattress { background: linear-gradient(to bottom, #b8dcc8, #98c4a8); }
    .bed-empty-hint { font-size: 8px; color: rgba(0,0,0,.2); letter-spacing: 1px; text-transform: uppercase; }

    .bed-name {
      font-size: 10px; font-weight: 600; color: var(--text-dark); text-align: center;
      max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      line-height: 1.3; min-height: 14px;
    }
    .bed-remove {
      background: none; border: none; color: #ef9a9a; cursor: pointer;
      font-size: 13px; padding: 0; opacity: 0; transition: opacity .15s; line-height: 1;
    }
    .bed-slot:hover .bed-remove { opacity: 1; }

    /* Vehicle card */
    .vehicle-card {
      background: var(--cream); border: 2px solid rgba(201,168,64,.35);
      border-radius: 8px; overflow: hidden; transition: border-color .3s, box-shadow .3s;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .vehicle-card.drop-over { border-color: var(--gold); }
    .vehicle-card.full { border-color: var(--green-lite); box-shadow: 0 4px 20px rgba(82,183,136,.25); }

    .vehicle-head {
      background: var(--navy-mid); padding: 12px 16px; display: flex; align-items: flex-start; gap: 10px;
      border-bottom: 1px solid rgba(201,168,64,.18); transition: background .3s;
    }
    .vehicle-card.full .vehicle-head { background: var(--green); }
    .vehicle-icon { font-size: 20px; line-height: 1; flex-shrink: 0; }
    .vehicle-name { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--gold-light); }
    .vehicle-card.full .vehicle-name { color: #a7f3d0; }
    .vehicle-meta { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 2px; }
    .vehicle-card.full .vehicle-meta { color: #6ee7b7; }
    .vehicle-delete {
      margin-left: auto; background: none; border: none; color: #ef9a9a; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0; opacity: 0; transition: opacity .15s; flex-shrink: 0;
    }
    .vehicle-card:hover .vehicle-delete { opacity: 1; }
    .vehicle-delete:hover { color: #e53935; }

    .vehicle-gauge { height: 4px; background: rgba(0,0,0,.15); }
    .vehicle-gauge-fill { height: 100%; background: var(--gold); transition: width .2s; }
    .vehicle-gauge-fill.full { background: var(--green); }

    .vehicle-body {
      padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px;
      background: var(--navy-light); align-content: flex-start;
    }
    .vehicle-hint { font-size: 11px; color: rgba(255,255,255,.3); text-align: center; width: 100%; padding: 14px 0; }

    .chip {
      background: var(--cream-dark); border: 1px solid rgba(201,168,64,.3);
      border-radius: 20px; padding: 6px 8px 6px 14px; font-size: 12px; color: var(--text-dark);
      font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
      cursor: grab; user-select: none; transition: all .15s;
    }
    .chip:hover { background: var(--cream); border-color: var(--gold); }
    .chip:active { cursor: grabbing; }
    .chip-remove {
      background: none; border: none; color: rgba(0,0,0,.3); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 0;
    }
    .chip-remove:hover { color: #e53935; }

    /* ═══════════════════════════════════════
       MODAL
    ═══════════════════════════════════════ */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center; z-index: 200;
    }
    .modal {
      background: var(--navy-mid); border: 1px solid rgba(201,168,64,.3);
      border-radius: 8px; padding: 32px; min-width: 340px; max-width: 420px; width: 90%;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .modal h3 { font-family: 'Playfair Display', serif; font-size: 21px; color: var(--gold-light); margin-bottom: 22px; }
    .modal-row { margin-bottom: 16px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
      background: var(--navy-mid); border: 1px solid var(--gold); color: var(--cream);
      padding: 10px 20px; border-radius: 6px; font-size: 13px;
      box-shadow: 0 12px 32px rgba(0,0,0,.4); z-index: 300;
    }
  </style>
</head>
<body>

<!-- ═══════════ START SCREEN ═══════════ -->
<div id="startScreen">
  <header class="start-header">
    <span class="ornament">✦ ✦ ✦</span>
    <h1>Fjordslottet Gjesteorganisering</h1>
    <div class="gold-rule"></div>
    <p>Rom &nbsp;·&nbsp; Biler &nbsp;·&nbsp; Bryllup</p>
  </header>

  <div class="start-single">
    <section class="card">
      <h2>Gjester</h2>

      <div>
        <label class="field-label">Lim inn fra Excel (ett navn per rad)</label>
        <textarea id="pasteArea" placeholder="Kopier celler fra Excel og lim inn her…"></textarea>
        <div class="gap">
          <button class="btn btn-gold" style="width:100%" onclick="addFromPaste()">Legg til fra liste</button>
        </div>
      </div>

      <div class="divider">eller</div>

      <div>
        <label class="field-label">Skriv inn enkeltvis</label>
        <div class="row-2">
          <input type="text" id="singleName" placeholder="Fullt navn"
            onkeydown="if(event.key==='Enter') addSingleName()">
          <button class="btn btn-gold" onclick="addSingleName()">Legg til</button>
        </div>
      </div>

      <div class="gap-lg">
        <div class="meta-text" id="guestMeta">0 gjester lagt til</div>
        <div class="tag-list" id="guestTagList"></div>
      </div>
    </section>
  </div>

  <div class="start-footer">
    <button class="btn btn-outline" onclick="document.getElementById('csvIn').click()">
      ↑&nbsp; Importer CSV
    </button>
    <input type="file" id="csvIn" accept=".csv" multiple style="display:none" onchange="importCSV(this)">
    <button class="btn-hero" onclick="startOrganizing()">Start organisering &rarr;</button>
  </div>
</div>


<!-- ═══════════ ORG SCREEN ═══════════ -->
<div id="orgScreen">
  <header class="org-header">
    <div class="menu-wrap">
      <button class="btn btn-outline btn-sm menu-btn" onclick="toggleMenu()" title="Bytt visning">☰</button>
      <div class="menu-dropdown" id="menuDropdown">
        <div class="menu-item" data-view="rooms" onclick="setView('rooms')"><span class="mi-icon">🛏️</span> Rom</div>
        <div class="menu-item" data-view="vehicles" onclick="setView('vehicles')"><span class="mi-icon">🚐</span> Biler</div>
      </div>
    </div>
    <span class="org-title">✦&nbsp; Fjordslottet &nbsp;·&nbsp; <span id="viewLabel">Rom</span></span>
    <div class="org-actions">
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('csvInOrg').click()">↑ Importer CSV</button>
      <input type="file" id="csvInOrg" accept=".csv" multiple style="display:none" onchange="importCSVInOrg(this)">
      <button class="btn btn-outline btn-sm" onclick="openPersonModal()">+ Person</button>
      <button class="btn btn-outline btn-sm" id="addRoomBtn" onclick="openRoomModal()">+ Rom</button>
      <button class="btn btn-outline btn-sm" id="addVehicleBtn" style="display:none" onclick="openVehicleModal()">+ Kjøretøy</button>
      <button class="btn btn-gold btn-sm" onclick="exportCSV()">Eksporter CSV</button>
      <button class="btn btn-outline btn-sm" onclick="goBack()">← Tilbake</button>
    </div>
  </header>

  <div class="org-body">
    <aside class="sidebar" id="sidebarEl">
      <div class="sidebar-header">
        <h3 id="sidebarTitle">Ufordelte gjester</h3>
        <div class="sidebar-meta" id="sidebarMeta"></div>
      </div>
      <div class="sidebar-list" id="sidebarList"></div>
    </aside>

    <div class="rooms-area">
      <div class="rooms-grid" id="resourceGrid"></div>
    </div>
  </div>
</div>


<!-- ═══════════ MODAL ═══════════ -->
<div class="modal-bg" id="modalBg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!-- ═══════════ TOAST ═══════════ -->
<div class="toast" id="toastEl" style="display:none"></div>


<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let guests   = [];   // string[] — shared between Rom and Biler
let rooms    = [];   // {id,label,capacity,assignments:(string|null)[]}
let vehicles = [];   // {id,type,seats,label,assigned:string[]}
let nextId   = 1;    // room ids
let nextVehId = 1;   // vehicle ids

let activeView = 'rooms'; // 'rooms' | 'vehicles'

let dragR = null; // room drag: {from:'sidebar'|'bed', name, roomId?, bedIdx?}
let dragV = null; // vehicle drag: {from:'sidebar'|'vehicle', name, vehicleId?}
let _uaR  = [];    // current unassigned-for-rooms cache, used by guest delete buttons
let _uaV  = [];    // current unassigned-for-vehicles cache
let selectedGuestChip = null; // click-to-assign in Biler view

const VEHICLE_TYPES = {
  buss:      { label: 'Buss',      icon: '🚌', defaultSeats: 50 },
  minibuss:  { label: 'Minibuss',  icon: '🚐', defaultSeats: 16 },
  personbil: { label: 'Personbil', icon: '🚗', defaultSeats: 4  },
};
function typeKeyFromLabel(label) {
  return Object.keys(VEHICLE_TYPES).find(k => VEHICLE_TYPES[k].label === label) || 'personbil';
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function unassigned() { // rooms domain
  const placed = new Set();
  rooms.forEach(r => r.assignments.forEach(a => { if (a) placed.add(a); }));
  return guests.filter(g => !placed.has(g));
}

function vehicleUnassigned() { // vehicles domain
  const placed = new Set();
  vehicles.forEach(v => v.assigned.forEach(n => placed.add(n)));
  return guests.filter(g => !placed.has(g));
}

function showToast(msg) {
  const el = document.getElementById('toastEl');
  clearTimeout(showToast._t);
  el.textContent = msg;
  el.style.display = 'block';
  showToast._t = setTimeout(() => { el.style.display = 'none'; }, 2400);
}

// ══════════════════════════════════════════
// START SCREEN — GUESTS
// ══════════════════════════════════════════
function parseExcel(text) {
  return text.split('\n')
    .map(l => l.split('\t')[0].trim())
    .filter(n => n.length > 0);
}

function addFromPaste() {
  const names = parseExcel(document.getElementById('pasteArea').value);
  names.forEach(n => { if (!guests.includes(n)) guests.push(n); });
  document.getElementById('pasteArea').value = '';
  renderGuestTags();
}

function addSingleName() {
  const el = document.getElementById('singleName');
  const n = el.value.trim();
  if (n && !guests.includes(n)) guests.push(n);
  el.value = '';
  el.focus();
  renderGuestTags();
}

function removeGuest(name) {
  guests = guests.filter(g => g !== name);
  rooms.forEach(r => { r.assignments = r.assignments.map(a => a === name ? null : a); });
  vehicles.forEach(v => { v.assigned = v.assigned.filter(n => n !== name); });
  renderGuestTags();
}

function renderGuestTags() {
  document.getElementById('guestMeta').textContent =
    `${guests.length} gjest${guests.length !== 1 ? 'er' : ''} lagt til`;
  document.getElementById('guestTagList').innerHTML = guests.map(n => `
    <div class="guest-tag">
      ${esc(n)}
      <button onclick="removeGuest(${JSON.stringify(n)})" title="Fjern">×</button>
    </div>`).join('');
}

// ── ROOMS: SIDEBAR ──
function renderRoomsSidebar() {
  document.getElementById('sidebarTitle').textContent = 'Ufordelte gjester';
  const ua = unassigned();
  document.getElementById('sidebarMeta').textContent = `${ua.length} av ${guests.length} ikke plassert`;

  const list = document.getElementById('sidebarList');
  if (!ua.length) {
    list.innerHTML = '<div class="sidebar-empty">Alle gjester er<br>plassert! 🎉</div>';
    return;
  }
  _uaR = ua;

  list.innerHTML = ua.map((n, i) => `
    <div class="guest-card" draggable="true" data-sidx="${i}">
      <span class="drag-dots">⠿</span>
      <span style="flex:1">${esc(n)}</span>
      <button class="guest-delete" draggable="false" title="Fjern gjest" onclick="event.stopPropagation();deleteGuest(_uaR[${i}])">×</button>
    </div>`).join('');

// ── ROOMS: GRID ──
function renderRoomsGrid() {
  document.getElementById('resourceGrid').innerHTML = rooms.map(renderRoom).join('');

  document.querySelectorAll('.bed-wrap').forEach(el => {
    const roomId = parseInt(el.dataset.room);
    const bedIdx = parseInt(el.dataset.bed);

    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      el.classList.add('drop-over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drop-over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drop-over');
      handleBedDrop(roomId, bedIdx);
    });

    const occ = rooms.find(r => r.id === roomId)?.assignments[bedIdx];
    if (occ) {
      el.addEventListener('dragstart', e => {
        dragR = { from: 'bed', name: occ, roomId, bedIdx };
        e.dataTransfer.effectAllowed = 'move';
      });
    }
  });
}

function renderRoom(room) {
  const filled = room.assignments.filter(Boolean).length;
  const full   = filled === room.capacity;
  const beds   = room.assignments.map((occ, bi) => {
    const occupied = !!occ;
    return `
      <div class="bed-slot">
        <div class="bed-wrap ${occupied ? 'occupied' : 'droppable'}"
          data-room="${room.id}" data-bed="${bi}"
          ${occupied ? 'draggable="true"' : ''}>
          <div class="bed-head"></div>
          <div class="bed-pillow"></div>
          <div class="bed-mattress">
            ${!occupied ? '<span class="bed-empty-hint">Ledig</span>' : ''}
          </div>
        </div>
        <div class="bed-name">${occ ? esc(occ) : ''}</div>
        ${occupied ? `<button class="bed-remove" onclick="removeBed(${room.id},${bi})" title="Fjern">×</button>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="room-card ${full ? 'full' : ''}" id="rc-${room.id}">
      <div class="room-card-head">
        <span class="room-label">${esc(room.label)}</span>
        <span class="room-tally">${filled}/${room.capacity}${full ? '  ✓' : ''}</span>
        <button class="room-delete" onclick="deleteRoom(${room.id})" title="Slett rom">×</button>
      </div>
      <div class="room-beds">${beds}</div>
    </div>`;
}

function handleBedDrop(roomId, bedIdx) {
  if (!dragR) return;
  const target  = rooms.find(r => r.id === roomId);
  const current = target.assignments[bedIdx];

  if (dragR.from === 'sidebar') {
    target.assignments[bedIdx] = dragR.name;
  } else {
    if (dragR.roomId === roomId && dragR.bedIdx === bedIdx) { dragR = null; return; }
    const src = rooms.find(r => r.id === dragR.roomId);
    src.assignments[dragR.bedIdx] = current;
    target.assignments[bedIdx]    = dragR.name;
  }
  dragR = null;
  renderOrg();
}

function removeBed(roomId, bedIdx) {
  const r = rooms.find(r => r.id === roomId);
  if (r) r.assignments[bedIdx] = null;
  renderOrg();
}

function deleteRoom(roomId) {
  rooms = rooms.filter(r => r.id !== roomId);
  renderOrg();
}

// ── VEHICLES: SIDEBAR ──
function renderVehiclesSidebar() {
  document.getElementById('sidebarTitle').textContent = 'Ikke tildelt kjøretøy';
  const ua = vehicleUnassigned();
  document.getElementById('sidebarMeta').textContent = `${ua.length} av ${guests.length} ikke plassert`;

  const list = document.getElementById('sidebarList');
  if (!ua.length) {
    list.innerHTML = '<div class="sidebar-empty">Alle gjester har<br>fått plass! 🎉</div>';
    return;
  }
  _uaV = ua;

  list.innerHTML = ua.map((n, i) => `
    <div class="guest-card ${selectedGuestChip === n ? 'selected' : ''}" draggable="true" data-sidx="${i}">
      <span class="drag-dots">⠿</span>
      <span style="flex:1">${esc(n)}</span>
      <button class="guest-delete" draggable="false" title="Fjern gjest" onclick="event.stopPropagation();deleteGuest(_uaV[${i}])">×</button>
    </div>`).join('');

  list.querySelectorAll('.guest-card').forEach(card => {
    const idx  = parseInt(card.dataset.sidx);
    const name = ua[idx];
    card.addEventListener('dragstart', e => {
      dragV = { from: 'sidebar', name };
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => card.classList.add('dragging'), 0);

      selectedGuestChip = selectedGuestChip === name ? null : name;

// ── VEHICLES: GRID ──
function renderVehiclesGrid() {
  document.getElementById('resourceGrid').innerHTML = vehicles.map(renderVehicle).join('');

  document.querySelectorAll('.vehicle-card').forEach(card => {
    const vid = parseInt(card.dataset.vehicle);

    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('drop-over'); });
    card.addEventListener('dragleave', () => card.classList.remove('drop-over'));
    card.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('drop-over');
      if (dragV) { assignToVehicle(dragV.name, vid); dragV = null; renderOrg(); }
    });
    card.addEventListener('click', () => {
      if (selectedGuestChip) { assignToVehicle(selectedGuestChip, vid); selectedGuestChip = null; renderOrg(); }
    });
  });

  document.querySelectorAll('.chip[draggable]').forEach(ch => {
    ch.addEventListener('dragstart', e => {
      dragV = { from: 'vehicle', name: ch.dataset.name, vehicleId: parseInt(ch.dataset.veh) };
      e.dataTransfer.effectAllowed = 'move';
    });
  });
}

function renderVehicle(v) {
  const meta  = VEHICLE_TYPES[v.type];
  const count = v.assigned.length;
  const full  = count >= v.seats;
  const pct   = Math.min(100, Math.round((count / v.seats) * 100));

  const chips = v.assigned.map(n => `
    <span class="chip" draggable="true" data-veh="${v.id}" data-name="${esc(n)}">
      ${esc(n)}
      <button class="chip-remove" onclick="event.stopPropagation();unassignFromVehicle(${JSON.stringify(n)});renderOrg();" title="Fjern">×</button>
    </span>`).join('');

  return `
    <div class="vehicle-card ${full ? 'full' : ''}" id="vc-${v.id}" data-vehicle="${v.id}">
      <div class="vehicle-head">
        <span class="vehicle-icon">${meta.icon}</span>
        <div style="flex:1">
          <div class="vehicle-name">${esc(v.label)}</div>
          <div class="vehicle-meta">${meta.label} &middot; ${count}/${v.seats} plasser${full ? '  ✓' : ''}</div>
        </div>
        <button class="vehicle-delete" onclick="event.stopPropagation();deleteVehicle(${v.id})" title="Slett kjøretøy">×</button>
      </div>
      <div class="vehicle-gauge"><div class="vehicle-gauge-fill ${full ? 'full' : ''}" style="width:${pct}%"></div></div>
      <div class="vehicle-body">
        ${chips || '<div class="vehicle-hint">Dra eller velg en gjest for å tildele</div>'}
      </div>
    </div>`;
}

function assignToVehicle(name, vehicleId) {
  const v = vehicles.find(x => x.id === vehicleId);
  if (!v) return;
  const already = v.assigned.filter(n => n !== name).length;
  if (already >= v.seats) { showToast(`${v.label} er full`); return; }
  vehicles.forEach(x => { x.assigned = x.assigned.filter(n => n !== name); });
  v.assigned.push(name);
}

function unassignFromVehicle(name) {
  vehicles.forEach(v => { v.assigned = v.assigned.filter(n => n !== name); });
}

function deleteVehicle(id) {
  vehicles = vehicles.filter(v => v.id !== id);
  renderOrg();
}

function deleteGuest(name) {
  guests = guests.filter(g => g !== name);
  rooms.forEach(r => { r.assignments = r.assignments.map(a => a === name ? null : a); });
  vehicles.forEach(v => { v.assigned = v.assigned.filter(n => n !== name); });
  if (selectedGuestChip === name) selectedGuestChip = null;
  renderOrg();
}

// ══════════════════════════════════════════
// EXPORT CSV — separate files for Rom and Biler
// ══════════════════════════════════════════
function exportCSV() {
  exportRoomsCSV();
  exportVehiclesCSV();
}

function exportRoomsCSV() {
  const rows = ['Navn,Rom'];
  rooms.forEach(room => {
    room.assignments.forEach(name => rows.push(`${csvCell(name ?? '')},${csvCell(room.label)}`));
  });
  unassigned().forEach(name => rows.push(`${csvCell(name)},${csvCell('Gjester')}`));
  downloadCSV(rows, 'romorganisering_fjordslottet.csv');
}

function exportVehiclesCSV() {
  const rows = ['Seksjon,Navn,Type,Seter,Kjoretoy'];
  vehicles.forEach(v => {
    rows.push(`${csvCell('Kjoretoy')},${csvCell(v.label)},${csvCell(VEHICLE_TYPES[v.type].label)},${csvCell(v.seats)},${csvCell('')}`);
    v.assigned.forEach(name => rows.push(`${csvCell('Gjest')},${csvCell(name)},${csvCell('')},${csvCell('')},${csvCell(v.label)}`));
  });
  vehicleUnassigned().forEach(name => rows.push(`${csvCell('Gjest')},${csvCell(name)},${csvCell('')},${csvCell('')},${csvCell('Venteliste')}`));
  downloadCSV(rows, 'bilorganisering_fjordslottet.csv');
}

function downloadCSV(rows, filename) {
  const blob = new Blob(['﻿' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  a.click();
  URL.revokeObjectURL(url);
}

function csvCell(s) { return `"${String(s).replace(/"/g, '""')}"`; }

// ══════════════════════════════════════════
// IMPORT CSV — one or both files at once, auto-detected
// ══════════════════════════════════════════
function importCSV(input) {
  readCSVFiles(input, (importedRooms, importedVehicles) => {
    finishImport(importedVehicles && !importedRooms);
  });
}

// Import triggered from inside the org screen (Rom or Biler view) — merges
// into whichever view(s) match the file(s), without leaving the current screen.
function importCSVInOrg(input) {
  readCSVFiles(input, (importedRooms, importedVehicles) => {
    if (!importedRooms && !importedVehicles) { showToast('Fant ingen gjenkjennbar CSV'); return; }
    const parts = [];
    if (importedRooms)    parts.push('rom');
    if (importedVehicles) parts.push('biler');
    showToast(`Importerte ${parts.join(' og ')}`);
    renderOrg();
  });
}

function readCSVFiles(input, onDone) {
  const files = Array.from(input.files || []);
  if (!files.length) return;

  let remaining = files.length;
  let importedRooms = false, importedVehicles = false;

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      let text = e.target.result;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());

      if (lines.length >= 1) {
        const header = lines[0].trim().toLowerCase();
        if (header.startsWith('navn,rom'))   { parseRoomsCSV(lines);    importedRooms    = true; }
        else if (header.startsWith('seksjon')) { parseVehiclesCSV(lines); importedVehicles = true; }
      }

      if (--remaining === 0) onDone(importedRooms, importedVehicles);
    };
    reader.readAsText(file, 'UTF-8');
  });

  input.value = '';
}

function parseRoomsCSV(lines) {
  const roomMap = {}; // label -> [(name|null)]
  for (let i = 1; i < lines.length; i++) {
    const parts = parseCSVLine(lines[i]);
    const name  = (parts[0] || '').trim();
    const room  = (parts[1] || '').trim();
    if (!room) continue;

    if (room !== 'Gjester') {
      if (!roomMap[room]) roomMap[room] = [];
      roomMap[room].push(name || null);
    }
    if (name && !guests.includes(name)) guests.push(name);
  }
  Object.entries(roomMap).forEach(([label, assignments]) => {
    rooms.push({ id: nextId++, label, capacity: assignments.length, assignments });
  });
}

function parseVehiclesCSV(lines) {
  const vehMap = {};        // label -> {label,type,seats}
  const guestTargets = [];  // {name, target}

  for (let i = 1; i < lines.length; i++) {
    const parts   = parseCSVLine(lines[i]);
    const seksjon = (parts[0] || '').trim();
    const navn    = (parts[1] || '').trim();
    const type    = (parts[2] || '').trim();
    const seter   = (parts[3] || '').trim();
    const target  = (parts[4] || '').trim();

    if (seksjon.toLowerCase() === 'kjoretoy') {
      if (navn) vehMap[navn] = { label: navn, type: typeKeyFromLabel(type), seats: parseInt(seter) || 1 };
    } else if (seksjon.toLowerCase() === 'gjest') {
      if (navn) {
        if (!guests.includes(navn)) guests.push(navn);
        guestTargets.push({ name: navn, target });
      }
    }
  }

  Object.values(vehMap).forEach(v => {
    vehicles.push({ id: nextVehId++, type: v.type, seats: v.seats, label: v.label, assigned: [] });
  });
  guestTargets.forEach(({ name, target }) => {
    if (!target || target === 'Venteliste') return;
    const v = vehicles.find(x => x.label === target);
    if (v) v.assigned.push(name);
  });
}

function finishImport(preferVehiclesView) {
  activeView = preferVehiclesView ? 'vehicles' : 'rooms';
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('orgScreen').style.display  = 'flex';
  updateHeaderForView();
  renderOrg();
}

function parseCSVLine(line) {
  const out = []; let cur = ''; let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
